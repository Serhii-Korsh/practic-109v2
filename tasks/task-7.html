<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div>
      <p class="taskTitle">ЗАДАЧА 4</p>
      <div id="box"></div>
      <button id="decrease">Зменшити</button>
      <button id="increase">Збільшити</button>
    </div>
    <input type="text" id="datetime-picker" />
    <button type="button" data-start disabled>Запуск</button>

    <div class="timer">
      <div class="field">
        <span class="value" data-days>00</span>
        <span class="label">Дни</span>
      </div>
      <div class="field">
        <span class="value" data-hours>00</span>
        <span class="label">Часы</span>
      </div>
      <div class="field">
        <span class="value" data-minutes>00</span>
        <span class="label">Минуты</span>
      </div>
      <div class="field">
        <span class="value" data-seconds>00</span>
        <span class="label">Секунды</span>
      </div>
    </div>
    <script type="module" src="../js/task-7.js"></script>
  </body>
</html>
